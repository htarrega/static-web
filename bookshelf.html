    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ------------------------------------------------------------------
           An interactive 3D shelf. The whole page is the experience, so the
           site-wide black theme from styles.css is overridden here, and the
           nav is restyled into the same ink-on-paper micro-typography.
           Geometry is pure CSS 3D: the covers on cv.htarrega.me are served
           without CORS headers, so a WebGL/canvas approach could not texture
           them (tainted canvas / SecurityError) — transforms can.
           ------------------------------------------------------------------ */

        :root {
            /* Site palette: black ground, white ink, the green accent from
               styles.css. Kept under the original variable names so every
               scrim and vignette follows automatically. */
            --paper: #000;
            --paper-deep: #0d100e;
            --paper-light: #171b18;
            --ink: #fff;
            --ink-soft: rgb(150, 150, 150);
            --hairline: rgba(255, 255, 255, .22);
            --accent: rgb(0, 172, 75);
            /* The site's stack for all chrome. The serif is reserved for the
               printed objects in the scene — spines and fallback jackets —
               where it reads as typesetting rather than interface. */
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
            /* Height of the shelf board, measured from the bottom of the stage. */
            --base: 20%;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--paper);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a,
        a:visited {
            color: inherit;
        }


        button {
            border: 0;
            color: inherit;
            font: inherit;
        }

        button:focus-visible,
        a:focus-visible,
        .shelf-stage:focus-visible {
            outline: 1px solid var(--ink);
            outline-offset: 5px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border-width: 0;
        }

        /* --- shell ----------------------------------------------------- */

        .press-experience {
            position: relative;
            isolation: isolate;
            /* Dragging the shelf would otherwise sweep a text selection across
               every spine and the caption. */
            -webkit-user-select: none;
            user-select: none;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 38%, rgba(0, 172, 75, .10), transparent 52%),
                var(--paper);
        }

        /* Grain. Multiply would be a no-op against black, so this is a faint
           additive dust instead — the same idea as the home page's field. */
        .press-experience::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            opacity: .5;
            background-image:
                radial-gradient(circle at 12% 31%, rgba(255, 255, 255, .05) 0 .7px, #0000 .8px),
                radial-gradient(circle at 73% 69%, rgba(255, 255, 255, .035) 0 .6px, #0000 .7px);
            background-size: 7px 9px, 11px 13px;
        }

        /* --- header / nav ---------------------------------------------- */

        /* The site nav keeps its styles.css appearance — fixed black bar,
           centred bracketed links — so this page reads as part of the site.
           Only .shelf-index has to opt out of that element-wide rule: its
           top:0 against the index's own bottom stretches it into a
           full-height invisible box over the shelf that eats every drag. */
        .is-focused .site-nav {
            opacity: .3;
            transition: opacity .3s;
        }

        /* --- 3D stage --------------------------------------------------- */

        .shelf-stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            perspective: 2600px;
            perspective-origin: 50% 46%;
            transform-style: preserve-3d;
            cursor: grab;
            touch-action: none;
            outline-offset: -6px;
        }

        .shelf-stage.is-dragging {
            cursor: grabbing;
        }

        /* Back panel: a deeper sheet of paper standing behind the volumes. */
        .shelf-back {
            position: absolute;
            left: -60vw;
            right: -60vw;
            bottom: var(--base);
            height: 78vh;
            transform: translateZ(-230px);
            background:
                linear-gradient(to top, #0a0c0a 0%, #131714 45%, #060706 100%);
        }

        /* Board: a horizontal plane through the base line. */
        .shelf-board {
            position: absolute;
            left: -60vw;
            right: -60vw;
            bottom: calc(var(--base) - 230px);
            height: 460px;
            transform: rotateX(90deg);
            background:
                linear-gradient(to top, #2e3530 0%, #1b201c 34%, #0e110f 68%, #070807 100%);
        }

        /* Front edge of the board, hanging below the base line. */
        .shelf-edge {
            position: absolute;
            left: -60vw;
            right: -60vw;
            bottom: calc(var(--base) - 15px);
            height: 15px;
            transform: translateZ(220px);
            background: linear-gradient(to bottom, #333a34, #121512);
            border-top: 1px solid rgba(255, 255, 255, .24);
            box-shadow: 0 16px 34px -12px #000;
        }

        .shelf-rail {
            position: absolute;
            left: 50%;
            bottom: var(--base);
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: translate3d(var(--offset, 0px), 0, 0);
            transition: transform .62s cubic-bezier(.22, 1, .36, 1);
        }

        .shelf-stage.is-dragging .shelf-rail,
        .shelf-stage.is-booting .shelf-rail {
            transition: none;
        }

        /* Scrubbing past ten books would otherwise queue ten overlapping 620ms
           transform transitions on six-face boxes while the rail tracks the
           finger with none — which reads as the shelf snagging. */
        .shelf-stage.is-dragging .book {
            transition-duration: .16s;
        }

        /* --- a volume --------------------------------------------------- */

        .book {
            position: absolute;
            bottom: 0;
            left: var(--x);
            width: var(--t);
            height: var(--h);
            transform-style: preserve-3d;
            transform-origin: 50% 100%;
            transform: translate3d(0, 0, var(--z)) rotateY(0deg);
            transition: transform .62s cubic-bezier(.22, 1, .36, 1), opacity .42s;
        }

        /* CSS 3D has no per-pixel depth buffer — it sorts whole planes. A volume
           rotated in place sweeps a depth range that overlaps its neighbours',
           and the browser then picks one order for the entire plane, which is
           what paints the book behind on top of the one you pulled out.
           Turning further actually shrinks the depth the box occupies
           ((t/2)·sinθ + (d/2)·cosθ), so a wider angle plus enough translateZ
           lifts the whole box clear of the shelf's range instead of through it. */
        .book.is-active {
            transform: translate3d(0, -18px, calc(var(--z) + 400px)) rotateY(-52deg);
        }

        .book.is-near {
            transform: translate3d(0, 0, calc(var(--z) + 6px)) rotateY(-3deg);
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            transition: opacity .42s;
            /* A transparent outline is the long-standing way to stop Chrome
               leaving the edges of a 3D-transformed element unantialiased: it
               gives the compositor a pixel of slack to blend into, so the
               near-vertical edges the perspective produces stop stepping. */
            outline: 1px solid transparent;
        }

        .book__shadow {
            transition: opacity .42s;
        }

        /* Spine: an invented cloth binding, not a slice of the jacket. Cropping
           the cover's left edge produced arbitrary fragments of artwork; a
           designed spine reads as a real shelf. Colour and ink come from a hash
           of the title when no colour has been derived for it yet.
           When real spine art turns up, give the entry a "spine" URL in
           books.json: it drops in under the shading and the invented type
           steps aside. */
        .face--spine {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            transform: translateZ(calc(var(--d) / 2));
            background-color: var(--cloth);
            background-image:
                linear-gradient(90deg,
                    #17130ea8 0%, #17130e2b 15%, #ffffff26 42%,
                    #ffffff10 58%, #17130e3d 84%, #17130eb0 100%),
                var(--spine-art, none);
            background-size: auto, cover;
            background-position: center, center;
            box-shadow: inset 0 0 0 1px #17130e26;
        }

        .book.has-spine-art .spine-text,
        .book.has-spine-art .spine-rule {
            display: none;
        }

        /* Banding rules, the way most cloth spines break up the type block. */
        .spine-rule {
            flex: none;
            width: 56%;
            height: 2px;
            background: var(--spine-ink);
            opacity: .3;
        }

        .spine-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            min-height: 0;
            overflow: hidden;
            margin: 9px 0;
            color: var(--spine-ink);
            font-family: var(--serif);
            font-size: clamp(9.5px, calc(var(--t) * .32), 13px);
            letter-spacing: .02em;
            line-height: 1.05;
            white-space: nowrap;
            text-shadow: 0 1px 1px #14110c4d;
            /* Long titles fade out instead of being guillotined mid-letter. */
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), #0000 100%);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), #0000 100%);
        }

        .spine-text i {
            font-style: normal;
            opacity: .68;
        }

        /* Front cover: sits on the +X plane, jacket art outward. */
        .face--cover {
            width: var(--d);
            height: 100%;
            inset: 0 auto auto 0;
            transform: translateX(calc(var(--t) / 2 - var(--d) / 2)) rotateY(90deg);
            background-color: var(--cloth);
            /* The gutter is a soft gradient, not an inset shadow: the shadow's
               spread put a hard dark band down the left edge that read as the
               jacket being clipped. */
            background-image:
                linear-gradient(90deg, #17130e6b 0%, #17130e1f 6%, #17130e00 15%),
                var(--cover);
            background-size: auto, cover;
            background-position: center, center;
            box-shadow: inset 0 0 0 1px #17130e1c;
        }

        /* Printed on the board from the first frame, so a volume is never a
           blank slab while its jacket is in flight. The image covers it. */
        .cover-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            color: var(--spine-ink);
            font-family: var(--serif);
            font-size: 15px;
            line-height: 1.3;
            text-align: center;
            opacity: .85;
        }

        .book.has-cover .cover-fallback {
            display: none;
        }

        .book.no-cover .face--cover {
            background-image: linear-gradient(150deg, #ffffff14, #17130e4d);
        }

        /* Back board: the same binding as the spine, so a tall volume standing
           beside a short one doesn't flash a slab of unrelated colour. */
        .face--back {
            width: var(--d);
            height: 100%;
            inset: 0 auto auto 0;
            transform: translateX(calc(var(--t) / -2 - var(--d) / 2)) rotateY(-90deg);
            background-color: var(--cloth);
            background-image: linear-gradient(90deg, #17130e26, #17130e5e 62%, #17130e8f);
            box-shadow: inset 0 0 0 1px #17130e26;
        }

        /* Fore-edge and head: stacked page block. */
        .face--edge,
        .face--top {
            background-color: #e9e0cc;
            background-image:
                repeating-linear-gradient(90deg, #00000012 0 1px, #0000 1px 3px),
                linear-gradient(180deg, #ddd4bf, #b6ac93);
        }

        .face--edge {
            transform: translateZ(calc(var(--d) / -2)) rotateY(180deg);
        }

        .face--top {
            height: var(--d);
            inset: 0 auto auto 0;
            width: 100%;
            transform: translateY(calc(var(--d) / -2)) rotateX(90deg);
            background-image:
                repeating-linear-gradient(90deg, #00000012 0 1px, #0000 1px 3px),
                linear-gradient(180deg, #b0a68d, #d8d0ba);
        }

        /* Contact shadow, laid flat 1px above the board. */
        .book__shadow {
            position: absolute;
            left: -14px;
            width: calc(var(--t) + 28px);
            height: var(--d);
            bottom: calc(var(--d) / -2);
            transform: rotateX(90deg) translateZ(1px);
            background: radial-gradient(ellipse 58% 52% at 50% 44%, #000000d9, #00000073 52%, #00000000 74%);
        }

        /* Distant volumes stay solid — fading them per-face makes each box
           translucent against itself (you see the back board through the
           spine), and fading .book instead is worse: opacity is a grouping
           property, so it forces transform-style back to flat and the
           fore-edge paints straight over the spine. The falloff is the
           .stage-fade vignette's job. */

        /* Edge vignette, on the flat layer so it never enters the 3D space. */
        .stage-fade {
            position: absolute;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            background:
                linear-gradient(90deg, var(--paper) 0%, #000000a8 6%, #00000000 15%, #00000000 85%, #000000a8 94%, var(--paper) 100%),
                linear-gradient(to bottom, var(--paper) 0%, #00000000 18%);
        }

        /* --- browse caption --------------------------------------------- */

        .browse-caption {
            position: absolute;
            z-index: 16;
            isolation: isolate;
            bottom: clamp(178px, 23vh, 228px);
            /* The reference uses clamp(24px, 5.4vw, 92px), but its arrows sit at
               clamp(15px, 2.7vw, 44px) + 50px wide — so below ~1850px the arrow
               overlaps the caption's first glyph and eats the volume number.
               Keep the reference value as the floor, then clear the arrow. */
            left: max(clamp(24px, 5.4vw, 92px), calc(clamp(15px, 2.7vw, 44px) + 62px));
            width: min(430px, 36vw);
            pointer-events: none;
            transition: opacity .42s, transform .52s cubic-bezier(.22, 1, .36, 1);
        }

        .browse-caption::before {
            content: "";
            position: absolute;
            inset: -42px -72px -38px -92px;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(90deg, #000000d9 0%, #0000008c 52%, #00000000 100%);
            /* The reference only fades horizontally; its top and bottom edges
               are hard. Over a canvas that never shows, but here they cut a
               visible rectangle across the volumes and the board. Fade them out
               inside the overhang so the gradient itself stays untouched. */
            -webkit-mask-image: linear-gradient(to bottom, #0000 0, #000 42px, #000 calc(100% - 38px), #0000 100%);
            mask-image: linear-gradient(to bottom, #0000 0, #000 42px, #000 calc(100% - 38px), #0000 100%);
        }

        .is-focused .browse-caption {
            opacity: 0;
            transform: translateX(-22px);
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 17px;
            font-size: 14px;
            font-weight: 400;
            line-height: 1;
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        .eyebrow__line {
            width: 46px;
            height: 1px;
            background: var(--ink);
            opacity: .35;
        }

        .browse-caption h1 {
            margin: 0;
            max-width: 460px;
            font-family: var(--sans);
            font-size: clamp(34px, 4vw, 64px);
            font-weight: 600;
            letter-spacing: -.03em;
            line-height: 1.02;
            text-wrap: balance;
        }

        .browse-caption__author {
            margin: clamp(10px, .9vw, 16px) 0 0;
            color: var(--ink-soft);
            font-family: var(--sans);
            font-size: clamp(17px, 1.45vw, 23px);
            line-height: 1.25;
        }

        .inspect-button {
            display: inline-block;
            margin-top: 22px;
            padding: 0;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            font-size: 16px;
            color: var(--ink);
        }

        .inspect-button {
            transition: color .2s, border-color .2s;
        }

        .inspect-button span:last-child {
            font-size: 14px;
            font-weight: 420;
            transition: transform .22s;
        }

        .inspect-button:hover,
        .back-button:hover,
        .official-link:hover {
            color: var(--accent);
        }

        .inspect-button:hover span:last-child {
            transform: translate(2px, -2px);
        }

        /* --- arrows ------------------------------------------------------ */

        .shelf-arrow {
            position: absolute;
            top: 49%;
            z-index: 17;
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            border: 1px solid var(--hairline);
            border-radius: 50%;
            background: rgba(255, 255, 255, .05);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: opacity .26s, transform .26s, background-color .22s;
        }

        .shelf-arrow:hover:not(:disabled) {
            background: rgba(0, 172, 75, .18);
            border-color: var(--accent);
            transform: scale(1.06);
        }

        .shelf-arrow:disabled {
            opacity: .25;
            cursor: default;
        }

        .is-focused .shelf-arrow {
            opacity: 0;
            pointer-events: none;
        }

        .shelf-arrow--left {
            left: clamp(15px, 2.7vw, 44px);
        }

        .shelf-arrow--right {
            right: clamp(15px, 2.7vw, 44px);
        }

        .arrow-icon {
            display: block;
            position: relative;
            width: 17px;
            height: 9px;
        }

        .arrow-icon span,
        .arrow-icon::before,
        .arrow-icon::after {
            content: "";
            display: block;
            position: absolute;
            background: currentColor;
        }

        .arrow-icon span {
            width: 17px;
            height: 1px;
            top: 4px;
        }

        .arrow-icon::before,
        .arrow-icon::after {
            width: 6px;
            height: 1px;
        }

        .arrow-icon--right::before {
            top: 2px;
            right: -1px;
            transform: rotate(45deg);
        }

        .arrow-icon--right::after {
            bottom: 2px;
            right: -1px;
            transform: rotate(-45deg);
        }

        .arrow-icon--left::before {
            top: 2px;
            left: -1px;
            transform: rotate(-45deg);
        }

        .arrow-icon--left::after {
            bottom: 2px;
            left: -1px;
            transform: rotate(45deg);
        }

        /* --- index ------------------------------------------------------- */

        .shelf-index {
            position: absolute;
            z-index: 19;
            bottom: 34px;
            left: clamp(24px, 5vw, 82px);
            right: clamp(24px, 5vw, 82px);
            display: grid;
            grid-template-columns: minmax(240px, 1fr) auto;
            align-items: end;
            gap: 38px;
            /* Opt out of the site-wide nav rule (see above). */
            top: auto;
            background: none;
            padding: 0;
            /* Belt and braces: the chrome layer must never eat a drag. */
            pointer-events: none;
            transition: opacity .3s, transform .42s cubic-bezier(.22, 1, .36, 1);
        }

        .shelf-index__ticks button {
            pointer-events: auto;
        }

        .is-focused .shelf-index {
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);
        }

        .shelf-index__ticks {
            display: grid;
            align-items: end;
            height: 21px;
        }

        .shelf-index__ticks button {
            position: relative;
            display: block;
            width: 100%;
            height: 21px;
            padding: 0;
            background: none;
            cursor: pointer;
        }

        .shelf-index__ticks button::before {
            content: "";
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--hairline);
        }

        .shelf-index__ticks button span {
            position: absolute;
            bottom: 1px;
            right: 50%;
            z-index: 1;
            width: 1px;
            height: 7px;
            background: var(--ink);
            opacity: .48;
            transition: height .22s, opacity .22s, width .22s;
        }

        .shelf-index__ticks button:hover span,
        .shelf-index__ticks button.is-active span {
            opacity: 1;
            width: 2px;
            height: 18px;
        }

        .input-hint {
            display: flex;
            align-items: center;
            gap: 11px;
            padding-bottom: 1px;
            color: var(--ink-soft);
            font-size: 14px;
            white-space: nowrap;
        }

        .input-hint i {
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: currentColor;
        }

        /* --- details panel ------------------------------------------------ */

        .book-details {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 22;
            width: min(620px, 41vw);
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: translateX(44px);
            transition: opacity .42s 80ms, transform .62s cubic-bezier(.22, 1, .36, 1);
        }

        .book-details::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(90deg, #00000000, #000000d1 10%, var(--paper) 24%), var(--paper);
        }

        .is-focused .book-details {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .book-details__inner {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            height: 100%;
            padding: 78px clamp(28px, 4vw, 68px) 30px clamp(52px, 6vw, 98px);
            border-left: 1px solid rgba(255, 255, 255, .10);
        }

        .book-details__top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 13px;
            padding: 0;
            background: none;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
        }

        .back-button .arrow-icon {
            transform: scale(.78);
        }

        .book-details__position {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 9px;
            font-weight: 620;
            letter-spacing: .14em;
        }

        .book-details__position span:first-child::after {
            content: "";
            display: inline-block;
            width: 34px;
            height: 1px;
            margin: 0 9px 3px 13px;
            background: currentColor;
            opacity: .28;
        }

        .book-details__copy {
            -webkit-user-select: text;
            user-select: text;
            align-self: center;
            max-height: 100%;
            padding: 34px 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--hairline) transparent;
        }

        .book-details__copy .eyebrow {
            margin-bottom: 20px;
            color: var(--ink-soft);
        }

        .book-details h2 {
            margin: 0;
            max-width: 500px;
            font-family: var(--sans);
            font-size: clamp(34px, 3.9vw, 60px);
            font-weight: 600;
            letter-spacing: -.03em;
            line-height: 1.02;
            text-wrap: balance;
        }

        .book-details__author {
            margin: clamp(10px, .9vw, 16px) 0 0;
            color: var(--ink-soft);
            font-family: var(--sans);
            font-size: clamp(17px, 1.4vw, 21px);
            line-height: 1.25;
        }

        .book-details__description {
            max-width: 520px;
            margin: 34px 0 0;
            font-family: var(--sans);
            font-size: 17px;
            line-height: 1.5;
        }

        .book-details dl {
            display: grid;
            grid-template-columns: .78fr 1.22fr;
            gap: 20px;
            max-width: 500px;
            margin: 34px 0 0;
            padding: 16px 0 0;
            border-top: 1px solid var(--hairline);
        }

        .book-details dl div {
            min-width: 0;
        }

        .book-details dt {
            margin-bottom: 5px;
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 600;
        }

        .book-details dd {
            margin: 0;
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.4;
        }

        .official-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            margin-top: 27px;
            padding: 16px 0 12px;
            border-top: 1px solid;
            border-bottom: 1px solid;
            font-size: 15px;
            text-decoration: none;
        }

        .official-link span:last-child {
            font-size: 16px;
            font-weight: 420;
            transition: transform .22s;
        }

        .official-link:hover span:last-child {
            transform: translate(3px, -3px);
        }

        .focus-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding-top: 16px;
            border-top: 1px solid var(--hairline);
            color: var(--ink-soft);
            font-size: 14px;
        }

        .focus-controls span + span::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 3px;
            margin: 0 14px 2px 0;
            border-radius: 50%;
            background: currentColor;
        }

        /* In focus mode the selected volume swings fully open on the left,
           the rest of the shelf steps back. */
        .is-focused .book.is-active {
            transform: translate3d(calc(min(620px, 41vw) / -2), -30px, calc(var(--z) + 430px)) rotateY(-90deg);
        }

        /* Same rule as .is-far: dim the faces, never the box. */
        .is-focused .book:not(.is-active) .face,
        .is-focused .book:not(.is-active) .book__shadow {
            opacity: .16;
        }

        /* The contact shadow is a child of the book, so it swings with it.
           Fade it as the volume turns instead of letting a flat rectangle
           rotate up off the board. */
        .book.is-active .book__shadow {
            opacity: .45;
        }

        .is-focused .book.is-active .book__shadow {
            opacity: 0;
        }

        /* Only reachable where the details panel is hidden — see the mobile
           breakpoint. On desktop the panel's own back button does this job. */
        .focus-exit {
            position: absolute;
            z-index: 23;
            display: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink);
        }

        /* --- status / loading --------------------------------------------- */

        .loading-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 22px;
            background: var(--paper);
            transition: opacity .8s cubic-bezier(.22, 1, .36, 1);
        }

        .is-ready .loading-screen {
            opacity: 0;
            pointer-events: none;
        }

        .loading-screen p {
            margin: 0;
            color: var(--ink-soft);
            font-size: 15px;
        }

        /* --- narrow screens ------------------------------------------------ */

        @media (max-width: 1020px) {
            .book-details {
                width: min(570px, 48vw);
            }


            .is-focused .book.is-active {
                transform: translate3d(calc(min(570px, 48vw) / -2), -30px, calc(var(--z) + 430px)) rotateY(-90deg);
            }

            .focus-controls span:nth-child(2) {
                display: none;
            }
        }

        @media (max-width: 760px) {
            :root {
                /* The caption is an opaque band across the bottom, so the
                   shelf has to sit clear of it. */
                --base: 40%;
            }

            .browse-caption {
                width: auto;
                bottom: 72px;
                left: 0;
                right: 0;
                padding: 34px 20px 12px;
                background: linear-gradient(180deg, #00000000, #000000f5 45px, var(--paper) 64px);
            }

            .browse-caption::before {
                display: none;
            }

            .browse-caption h1 {
                max-width: none;
                font-size: clamp(25px, 7.4vw, 34px);
                line-height: 1.1;
            }

            .browse-caption__author {
                font-size: 17px;
            }

            .inspect-button {
                margin-top: 14px;
            }

            /* Touch browses by dragging; the arrows were two more targets
               competing for the bottom of the screen. */
            .shelf-arrow {
                display: none;
            }

            .shelf-index {
                display: block;
                bottom: 30px;
                left: 24px;
                right: 24px;
            }

            .shelf-index__ticks,
            .shelf-index__ticks button {
                height: 13px;
            }

            .shelf-index__ticks button span {
                height: 5px;
                bottom: 2px;
            }

            .shelf-index__ticks button:hover span,
            .shelf-index__ticks button.is-active span {
                height: 12px;
            }

            .input-hint {
                display: none;
            }

            /* No reading panel on a phone: opening a volume shows the jacket
               and nothing else. The sheet took half the screen to print what
               the cover already says. */
            .book-details {
                display: none;
            }

            .focus-exit {
                display: block;
                bottom: 34px;
                left: 50%;
                opacity: 0;
                pointer-events: none;
                transform: translateX(-50%);
                transition: opacity .3s;
            }

            .is-focused .focus-exit {
                opacity: 1;
                pointer-events: auto;
            }

            /* Nothing competes for the screen now, so the jacket can come
               most of the way forward. */
            .is-focused .book.is-active {
                transform: translate3d(0, 13vh, calc(var(--z) + 780px)) rotateY(-90deg);
            }



            .book-details__inner {
                padding: 9px 20px max(14px, env(safe-area-inset-bottom));
                border-top: 1px solid rgba(255, 255, 255, .10);
                border-left: 0;
            }








            /* The sheet is short; the adjacent volumes are the first thing to
               go. Desktop keeps them. */



            .is-focused .site-nav {
                opacity: .52;
            }
        }

        @media (max-height: 700px) and (min-width: 761px) {
            .browse-caption {
                bottom: 94px;
            }

            .book-details__copy {
                padding-top: 18px;
                padding-bottom: 18px;
            }

            .book-details h2 {
                font-size: clamp(38px, 4vw, 58px);
            }

            .book-details__description,
            .book-details dl {
                margin-top: 20px;
            }
        }

        @media (pointer: coarse) {
            .shelf-stage {
                cursor: default;
            }

            .shelf-index__ticks button {
                min-height: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .shelf-rail,
            .book,
            .face,
            .book__shadow,
            .browse-caption,
            .book-details,
            .shelf-index,
            .loading-screen {
                transition-duration: .01ms;
            }
        }
    </style>

<body>
    <main class="press-experience" id="experience">
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">[htarrega.me]</a></li>
                <li><a href="cv.html">[cv]</a></li>
                <li><a href="bookshelf.html" aria-current="page">[bookshelf]</a></li>
                <li><a href="posts.html">[posts]</a></li>
            </ul>
        </nav>

        <div class="shelf-stage" id="stage" role="application" tabindex="0"
            aria-label="Interactive three-dimensional shelf. Drag or use the arrow keys to browse. Press Enter to inspect the selected book.">
            <div class="shelf-back"></div>
            <div class="shelf-board"></div>
            <div class="shelf-edge"></div>
            <div class="shelf-rail" id="rail"></div>
        </div>
        <div class="stage-fade"></div>


        <section class="browse-caption" id="caption">
            <p class="eyebrow">
                <span id="caption-index">01</span>
                <span class="eyebrow__line"></span>
                <span id="caption-total">—</span>
            </p>
            <h1 id="caption-title"></h1>
            <p class="browse-caption__author" id="caption-author"></p>
            <button type="button" class="inspect-button" id="inspect">[details]</button>
        </section>

        <button type="button" class="shelf-arrow shelf-arrow--left" id="prev" aria-label="Previous book">
            <span aria-hidden="true" class="arrow-icon arrow-icon--left"><span></span></span>
        </button>
        <button type="button" class="shelf-arrow shelf-arrow--right" id="next" aria-label="Next book">
            <span aria-hidden="true" class="arrow-icon arrow-icon--right"><span></span></span>
        </button>

        <nav class="shelf-index" aria-label="Catalog position">
            <div class="shelf-index__ticks" id="ticks"></div>
            <div class="input-hint" aria-hidden="true">
                <span>drag</span><i></i><span>scroll</span><i></i><span>arrow keys</span>
            </div>
        </nav>

        <aside class="book-details" id="details" aria-hidden="true" aria-label="Book details"></aside>

        <button type="button" class="focus-exit" id="focus-exit">[back to shelf]</button>


        <div class="loading-screen" aria-hidden="false">
            <p>loading the shelf...</p>
        </div>


        <div class="sr-only" aria-live="polite" id="announcer"></div>
    </main>

    <script>
        (function () {
            'use strict';

            // Book proportions, in px. Thickness and height are derived from a
            // hash of the title so a volume always looks the same, and a shelf
            // of 32 never reads as a row of identical slabs.
            var GAP = 3;

            // Fallback bindings, used only when an entry has no derived
            // spineColor. Each pairs a cloth with an ink that stays legible on
            // it, so light linens get dark type.
            var CLOTHS = [
                { bg: '#8c3a33', ink: '#fbeedb' },  // oxblood
                { bg: '#3d5a46', ink: '#eef0e2' },  // forest
                { bg: '#31486a', ink: '#e9edf4' },  // navy
                { bg: '#a8813a', ink: '#fff8e6' },  // ochre
                { bg: '#4e4e58', ink: '#eeece7' },  // slate
                { bg: '#6f4a66', ink: '#f5e9f0' },  // plum
                { bg: '#2a5d59', ink: '#e6f0ec' },  // teal
                { bg: '#d9cdb4', ink: '#33291d' },  // linen
                { bg: '#c25f36', ink: '#fff0e6' },  // brick
                { bg: '#3a3a3a', ink: '#e5e0d5' },  // charcoal
                { bg: '#cbb78e', ink: '#332a1b' },  // tan
                { bg: '#5c7247', ink: '#f2f4e6' }   // olive
            ];

            var stage = document.getElementById('stage');
            var rail = document.getElementById('rail');
            var ticksEl = document.getElementById('ticks');
            var detailsEl = document.getElementById('details');
            var experience = document.getElementById('experience');
            var announcer = document.getElementById('announcer');
            var captionTitle = document.getElementById('caption-title');
            var captionAuthor = document.getElementById('caption-author');
            var captionIndex = document.getElementById('caption-index');
            var captionTotal = document.getElementById('caption-total');
            var prevBtn = document.getElementById('prev');
            var nextBtn = document.getElementById('next');

            var books = [];
            var nodes = [];
            var tickNodes = [];
            var offsets = [];   // rail offset that centres each volume
            var active = 0;
            var focused = false;

            function hash(str) {
                var h = 2166136261;
                for (var i = 0; i < str.length; i++) {
                    h ^= str.charCodeAt(i);
                    h = (h * 16777619) >>> 0;
                }
                return h;
            }

            function pad(n) {
                return n < 10 ? '0' + n : String(n);
            }

            function esc(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function scale() {
                // Shrink the whole shelf on short or narrow viewports so a
                // volume always fits between the header and the index.
                var h = Math.min(window.innerHeight, window.innerWidth * 1.05);
                return Math.max(0.5, Math.min(1.2, h / 940));
            }

            function build() {
                var k = scale();
                var x = 0;

                // Volumes are as deep as their jackets are wide, so centring
                // them on z=0 puts every spine at a different depth — and each
                // cover then crosses the plane of the next book's spine. CSS 3D
                // resolves intersecting planes per plane, not per pixel, and
                // picks arbitrarily: the same page rendered spines one moment
                // and a fan of covers the next. Aligning the fronts, the way
                // books actually sit on a shelf, makes every spine coplanar so
                // nothing intersects.
                var dims = books.map(function (b) {
                    var seed = hash(b.title + '|' + (b.author || ''));
                    var thickness = b.pages > 0
                        ? Math.min(66, Math.max(16, 8 + b.pages * 0.062))
                        : 22 + (seed % 8) * 4;
                    var height = Math.round((420 + ((seed >>> 5) % 6) * 19) * k);
                    var ratio = Math.min(0.95, Math.max(0.5, b.ratio || b._ratio || 0.66));
                    return {
                        seed: seed,
                        t: Math.round(thickness * k),
                        h: height,
                        d: Math.round(height * ratio)
                    };
                });
                var maxDepth = dims.reduce(function (m, x) { return Math.max(m, x.d); }, 0);
                rail.textContent = '';
                nodes = [];
                offsets = [];

                books.forEach(function (book, i) {
                    // Thickness is adapted from the real page count (paper bulk
                    // plus boards), depth from the jacket's measured proportions
                    // so `background-size: cover` has nothing to crop. Both come
                    // from the pass above, which also needs unsigned shifts:
                    // hash() returns a full uint32 and a signed >> would flip
                    // the top half negative.
                    var dim = dims[i];
                    var seed = dim.seed;
                    var thickness = dim.t;
                    var height = dim.h;
                    var depth = dim.d;
                    // Binding sampled from the jacket itself when books.json
                    // carries it (see scripts/derive-spines.py). The palette
                    // below is the fallback for entries added since.
                    var cloth;
                    if (book.spineColor) {
                        cloth = { bg: book.spineColor, ink: book.spineInk || '#f0ece2' };
                    } else {
                        cloth = CLOTHS[(seed >>> 11) % CLOTHS.length];
                        // Neighbours in the same cloth read as one fat book.
                        if (i > 0 && cloth.bg === books[i - 1]._clothBg) {
                            cloth = CLOTHS[((seed >>> 11) + 5) % CLOTHS.length];
                        }
                    }
                    book._clothBg = cloth.bg;

                    var el = document.createElement('div');
                    el.className = 'book';
                    el.style.setProperty('--t', thickness + 'px');
                    el.style.setProperty('--h', height + 'px');
                    el.style.setProperty('--d', depth + 'px');
                    el.style.setProperty('--x', x + 'px');
                    el.style.setProperty('--z', Math.round((maxDepth - depth) / 2) + 'px');
                    el.style.setProperty('--cloth', cloth.bg);
                    el.style.setProperty('--spine-ink', cloth.ink);
                    if (book.spine) {
                        el.style.setProperty('--spine-art', 'url("' + book.spine + '")');
                        el.classList.add('has-spine-art');
                    }
                    el.setAttribute('role', 'button');
                    el.setAttribute('tabindex', '-1');
                    el.setAttribute('aria-label', book.title + (book.author ? ' by ' + book.author : ''));
                    el.dataset.index = String(i);

                    var label = esc(book.title) + (book.author ? ' <i>· ' + esc(book.author) + '</i>' : '');
                    el.innerHTML =
                        '<div class="book__shadow"></div>' +
                        '<div class="face face--spine">' +
                            '<span class="spine-rule"></span>' +
                            '<span class="spine-text">' + label + '</span>' +
                            '<span class="spine-rule"></span>' +
                        '</div>' +
                        '<div class="face face--cover"><span class="cover-fallback">' +
                            esc(book.title) + '</span></div>' +
                        '<div class="face face--back"></div>' +
                        '<div class="face face--edge"></div>' +
                        '<div class="face face--top"></div>';

                    // A rebuild (resize) makes new elements; carry over what
                    // we already know about this jacket rather than refetching.
                    if (book._cover === 'ok') {
                        el.style.setProperty('--cover', 'url("' + book.cover + '")');
                        el.classList.add('has-cover');
                    } else if (book._cover === 'failed') {
                        el.classList.add('no-cover');
                    }

                    rail.appendChild(el);
                    nodes.push(el);
                    offsets.push(-(x + thickness / 2));
                    x += thickness + GAP * k;
                });
            }

            // Jackets are 99% of what this page transfers, and the shelf is
            // spine-out: one cover is readable at a time and a handful show a
            // 50-90px sliver. Fetching all 32 up front spent 1.4 MB to render a
            // few pixels each. This pulls a window around the selection and
            // widens it as the reader moves, so the opening view costs one
            // jacket instead of thirty-two.
            var COVER_SPAN = 4;

            function ensureCover(i) {
                var book = books[i];
                var el = nodes[i];
                if (!book || !el || book._cover) return;
                book._cover = 'loading';
                var img = new Image();
                img.onload = function () {
                    book._cover = 'ok';
                    // nodes[i] may be a different element by now (resize).
                    var live = nodes[i];
                    if (!live) return;
                    live.style.setProperty('--cover', 'url("' + book.cover + '")');
                    live.classList.add('has-cover');
                };
                img.onerror = function () {
                    book._cover = 'failed';
                    if (nodes[i]) nodes[i].classList.add('no-cover');
                };
                img.src = book.cover;
            }

            function coversAround(i) {
                var lo = Math.max(0, i - COVER_SPAN);
                var hi = Math.min(books.length - 1, i + COVER_SPAN);
                for (var j = lo; j <= hi; j++) ensureCover(j);
            }

            function buildTicks() {
                ticksEl.textContent = '';
                ticksEl.style.gridTemplateColumns = 'repeat(' + books.length + ', 1fr)';
                tickNodes = books.map(function (book, i) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.setAttribute('aria-label', 'Browse to ' + book.title);
                    b.appendChild(document.createElement('span'));
                    b.addEventListener('click', function () { select(i); });
                    ticksEl.appendChild(b);
                    return b;
                });
            }

            function paint() {
                var book = books[active];
                if (!book) return;

                rail.style.setProperty('--offset', offsets[active] + 'px');

                nodes.forEach(function (el, i) {
                    var d = Math.abs(i - active);
                    el.classList.toggle('is-active', d === 0);
                    el.classList.toggle('is-near', d === 1);
                });

                tickNodes.forEach(function (t, i) {
                    var on = i === active;
                    t.classList.toggle('is-active', on);
                    if (on) t.setAttribute('aria-current', 'true');
                    else t.removeAttribute('aria-current');
                });

                coversAround(active);
                captionTitle.textContent = book.title;
                captionAuthor.textContent = book.author || 'Anonymous';
                captionIndex.textContent = pad(active + 1);
                prevBtn.disabled = active === 0;
                nextBtn.disabled = active === books.length - 1;

                if (focused) renderDetails();
                announcer.textContent = 'Selected ' + book.title +
                    (book.author ? ' by ' + book.author : '') + '.';
            }

            function select(i, options) {
                var next = Math.max(0, Math.min(books.length - 1, i));
                if (next === active) return;
                active = next;
                paint();
                if (options && options.scrollTick) {
                    tickNodes[active].scrollIntoView({ block: 'nearest', inline: 'nearest' });
                }
            }

            function renderDetails() {
                var book = books[active];
                var before = books[active - 1];
                var after = books[active + 1];

                // Only real data from books.json is rendered. The optional
                // fields below are picked up automatically if entries ever
                // grow a description / year / publisher / link.
                // The neighbours are marked rather than omitted: the mobile
                // sheet hides them in CSS, so rotating the phone is enough to
                // get them back without re-rendering.
                var meta = '';
                function row(term, value, cls) {
                    if (!value) return;
                    meta += '<div' + (cls ? ' class="' + cls + '"' : '') + '><dt>' +
                        esc(term) + '</dt><dd>' + esc(value) + '</dd></div>';
                }
                row('Before it', before ? before.title : '—', 'meta-aside');
                row('After it', after ? after.title : '—', 'meta-aside');
                row('Pages', book.pages);
                row('First published', book.year);
                row('Publisher', book.publisher);

                detailsEl.innerHTML =
                    '<div class="book-details__inner">' +
                        '<div class="book-details__top">' +
                            '<button type="button" class="back-button" id="back">[back to shelf]</button>' +
                        '</div>' +
                        '<div class="book-details__copy">' +
                            '<p class="eyebrow"><span>' + pad(active + 1) + '</span>' +
                                '<span class="eyebrow__line"></span><span>' + pad(books.length) + '</span></p>' +
                            '<h2>' + esc(book.title) + '</h2>' +
                            '<p class="book-details__author">' + esc(book.author || 'Anonymous') + '</p>' +
                            (book.description ? '<p class="book-details__description">' + esc(book.description) + '</p>' : '') +
                            (meta ? '<dl' + (book.pages ? '' : ' class="aside-only"') +
                                '>' + meta + '</dl>' : '') +
                            (book.link ? '<a class="official-link" href="' + esc(book.link) +
                                '" target="_blank" rel="noopener">[more about this book]</a>' : '') +
                        '</div>' +
                        '<div class="focus-controls">' +
                            '<span>arrow keys for other books</span>' +
                            '<span>esc to return</span>' +
                        '</div>' +
                    '</div>';

                var back = detailsEl.querySelector('#back');
                back.addEventListener('click', function () { setFocus(false); });
                // Arrowing between volumes re-renders the panel and throws the
                // focus back to <body>; put it where the user left it.
                if (focused && !detailsEl.contains(document.activeElement)) back.focus();
            }

            function setFocus(on) {
                if (on === focused) return;
                focused = on;
                experience.classList.toggle('is-focused', on);
                detailsEl.setAttribute('aria-hidden', on ? 'false' : 'true');
                if (on) {
                    renderDetails();
                    var back = detailsEl.querySelector('#back');
                    var exit = document.getElementById('focus-exit');
                    // offsetParent is null for a display:none element, which is
                    // exactly the mobile case.
                    if (back && back.offsetParent) back.focus();
                    else if (exit && exit.offsetParent) exit.focus();
                } else {
                    detailsEl.innerHTML = '';
                    stage.focus();
                }
            }

            /* --- input ---------------------------------------------------- */

            // Pointer capture retargets events to the stage, so hit-test by
            // coordinates instead of reading e.target.
            function bookAt(x, y) {
                var under = document.elementFromPoint(x, y);
                return under && under.closest ? under.closest('.book') : null;
            }

            function nearestTo(offset) {
                var best = 0;
                var bestD = Infinity;
                for (var i = 0; i < offsets.length; i++) {
                    var d = Math.abs(offsets[i] - offset);
                    if (d < bestD) { bestD = d; best = i; }
                }
                return best;
            }

            var dragging = false;
            var pointerId = null;
            var startX = 0;
            var startOffset = 0;
            var moved = 0;
            // Tap bookkeeping, so a double click can be told from two picks.
            var volumeTaps = 0;     // taps in the current run, 0 if it missed
            var volumeTapAt = 0;
            var volumeTapX = 0;
            var volumeTapY = 0;
            var TAP_PAIR = 600;     // ms; over any system's double-click speed
            var TAP_SLOP = 32;      // px; farther apart is two separate picks

            stage.addEventListener('pointerdown', function (e) {
                if (focused || e.button !== 0) return;
                dragging = true;
                pointerId = e.pointerId;
                startX = e.clientX;
                startOffset = offsets[active];
                moved = 0;
                stage.classList.add('is-dragging');
                try { stage.setPointerCapture(pointerId); } catch (err) { /* pointer already gone */ }
            });

            stage.addEventListener('pointermove', function (e) {
                if (!dragging || e.pointerId !== pointerId) return;
                var dx = e.clientX - startX;
                moved = Math.max(moved, Math.abs(dx));
                var offset = startOffset + dx;
                rail.style.setProperty('--offset', offset + 'px');
                var i = nearestTo(offset);
                if (i !== active) {
                    active = i;
                    // Repaint the chrome, but leave the rail under the finger.
                    var held = rail.style.getPropertyValue('--offset');
                    paint();
                    rail.style.setProperty('--offset', held);
                }
            });

            // A finger or a stylus, which touch the jacket itself rather than
            // pointing at it from a distance.
            function isDirect(e) {
                return e.pointerType === 'touch' || e.pointerType === 'pen';
            }

            // The follow-up click of a double click: soon after a tap that hit
            // a jacket, and close enough to it that it is the same gesture
            // rather than an impatient pick of another volume.
            function isSecondTap(e) {
                return volumeTaps > 0 &&
                    e.timeStamp - volumeTapAt < TAP_PAIR &&
                    Math.abs(e.clientX - volumeTapX) < TAP_SLOP &&
                    Math.abs(e.clientY - volumeTapY) < TAP_SLOP;
            }

            function endDrag(e) {
                if (focused) {
                    // Tapping the enlarged volume puts it back. The details
                    // panel is a sibling of the stage, so tapping it never
                    // reaches here.
                    if (e && e.type === 'pointerup' && e.button === 0) setFocus(false);
                    return;
                }
                if (!dragging || (e && e.pointerId !== pointerId)) return;
                dragging = false;
                stage.classList.remove('is-dragging');
                try { stage.releasePointerCapture(pointerId); } catch (err) { /* already gone */ }
                paint();

                // A tap, not a drag: bring whatever was under the pointer to
                // the front. With a mouse, opening it takes a second click.
                if (moved < 6 && e && e.type === 'pointerup') {
                    if (isSecondTap(e)) {
                        // The rail is still sliding the volume picked by the
                        // first click into place. Hit-testing again here would
                        // find whatever drifted under the pointer meanwhile and
                        // send the shelf somewhere the gesture never aimed.
                        volumeTaps++;
                    } else {
                        var hit = bookAt(e.clientX, e.clientY);
                        volumeTaps = hit ? 1 : 0;
                        if (hit) {
                            var i = Number(hit.dataset.index);
                            // A finger has no double click and no hover to
                            // preview with, so tapping the volume that is
                            // already centred opens it outright.
                            if (i === active && isDirect(e)) volumeTaps = 2;
                            else select(i);
                        }
                    }
                    if (volumeTaps >= 2) {
                        volumeTaps = 0;
                        setFocus(true);
                    }
                    volumeTapAt = e.timeStamp;
                    volumeTapX = e.clientX;
                    volumeTapY = e.clientY;
                } else {
                    // A drag, or a pointer lost mid-gesture: neither is a tap,
                    // and neither may pair with the next one into a double click.
                    volumeTaps = 0;
                }
            }

            stage.addEventListener('pointerup', endDrag);
            stage.addEventListener('pointercancel', endDrag);

            var wheelAcc = 0;
            var wheelLock = false;
            stage.addEventListener('wheel', function (e) {
                if (focused) return;
                e.preventDefault();
                wheelAcc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                if (wheelLock || Math.abs(wheelAcc) < 42) return;
                select(active + (wheelAcc > 0 ? 1 : -1));
                wheelAcc = 0;
                wheelLock = true;
                setTimeout(function () { wheelLock = false; }, 130);
            }, { passive: false });

            document.addEventListener('keydown', function (e) {
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                switch (e.key) {
                    case 'ArrowRight': select(active + 1); e.preventDefault(); break;
                    case 'ArrowLeft': select(active - 1); e.preventDefault(); break;
                    case 'Home': select(0); e.preventDefault(); break;
                    case 'End': select(books.length - 1); e.preventDefault(); break;
                    case 'Escape':
                        if (focused) { setFocus(false); e.preventDefault(); }
                        break;
                    case 'Enter':
                    case ' ':
                        if (!focused && document.activeElement === stage) {
                            setFocus(true);
                            e.preventDefault();
                        }
                        break;
                }
            });

            prevBtn.addEventListener('click', function () { select(active - 1); });
            nextBtn.addEventListener('click', function () { select(active + 1); });
            document.getElementById('inspect').addEventListener('click', function () { setFocus(true); });
            document.getElementById('focus-exit').addEventListener('click', function () { setFocus(false); });

            // Opening and closing a volume both ride on pointerup, in endDrag.
            // The stage captures the pointer and turns off touch-action, so the
            // click and dblclick a mouse would synthesize are not dependable
            // here — and a finger may not synthesize them at all.

            var resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    build();
                    paint();
                }, 160);
            });

            /* --- boot ------------------------------------------------------ */


            fetch('resources/books.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    books = data;
                    captionTotal.textContent = pad(books.length);

                    active = Math.floor(Math.random() * books.length);
                    buildTicks();

                    // Lay out immediately. Each volume's depth comes from its
                    // jacket's proportions, but those are baked into books.json
                    // (scripts/derive-spines.py), so nothing has to be
                    // downloaded to know them. Waiting on the images instead
                    // meant 1.4 MB before the shelf appeared — over four
                    // seconds on a slow connection, for geometry we already had.
                    // Land on the opening volume already centred instead of
                    // sliding in from the first spine.
                    stage.classList.add('is-booting');
                    build();
                    paint();
                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            stage.classList.remove('is-booting');
                        });
                    });
                    experience.classList.add('is-ready');
                })
                .catch(function (error) {
                    console.error('Error loading books:', error);
                    document.querySelector('.loading-screen p').textContent = 'the shelf could not be loaded';
                });
        })();
    </script>
</body>

</html>
